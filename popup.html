<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenCap</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0f1117;
      --surface: #181a24;
      --surface-hover: #1e2130;
      --border: #2a2d3a;
      --text: #e4e6ef;
      --text-dim: #8b8fa3;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.25);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.25);
      --orange: #f59e0b;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
    }

    .header svg { flex-shrink: 0; }

    .header h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header span {
      font-size: 10px;
      color: var(--text-dim);
      background: var(--surface);
      padding: 2px 7px;
      border-radius: 20px;
      margin-left: auto;
      font-weight: 500;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 14px 18px 8px;
    }

    .actions {
      padding: 0 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-glow);
    }

    .btn:active { transform: scale(0.985); }

    .btn .icon-wrap {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .btn .icon-wrap.blue { background: rgba(99, 102, 241, 0.12); }
    .btn .icon-wrap.violet { background: rgba(139, 92, 246, 0.12); }
    .btn .icon-wrap.rose { background: rgba(244, 63, 94, 0.12); }

    .btn .label {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .btn .label .title { font-weight: 600; font-size: 13px; }

    .btn .label .desc {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
    }

    .btn .shortcut {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-dim);
      background: var(--bg);
      padding: 3px 8px;
      border-radius: 5px;
      font-weight: 500;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    /* Recording state */
    .btn.recording {
      border-color: var(--red);
      box-shadow: 0 0 0 1px var(--red-glow), 0 0 20px var(--red-glow);
    }

    .btn.recording .rec-dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      margin-left: auto;
      animation: pulse 1s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Status bar */
    .status {
      padding: 10px 18px 14px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--border);
    }

    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.working { color: var(--orange); }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }

    .status.success .status-dot { background: var(--green); }
    .status.error .status-dot { background: var(--red); }
    .status.working .status-dot { background: var(--orange); animation: pulse 0.8s ease-in-out infinite; }

    .hidden { display: none !important; }

    /* Format selector */
    .format-bar {
      padding: 6px 12px 2px;
      display: flex;
      gap: 6px;
    }

    .format-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .format-btn:hover { color: var(--text); border-color: var(--accent); }

    .format-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <rect x="2" y="3" width="16" height="12" rx="2" stroke="#6366f1" stroke-width="1.5" fill="none"/>
      <circle cx="10" cy="9" r="3" stroke="#6366f1" stroke-width="1.5" fill="none"/>
      <line x1="6" y1="18" x2="14" y2="18" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>ScreenCap</h1>
    <span>v1.0</span>
  </div>

  <div class="section-label">Screenshots</div>

  <div class="format-bar">
    <button class="format-btn active" data-format="png">PNG</button>
    <button class="format-btn" data-format="jpeg">JPEG</button>
  </div>

  <div class="actions">
    <button class="btn" id="captureVisible">
      <div class="icon-wrap blue">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="2" y="2" width="14" height="14" rx="2" stroke="#6366f1" stroke-width="1.5"/>
          <rect x="5" y="5" width="8" height="8" rx="1" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="2 2"/>
        </svg>
      </div>
      <div class="label">
        <span class="title">Visible Area</span>
        <span class="desc">Capture what's on screen</span>
      </div>
    </button>

    <button class="btn" id="captureFullPage">
      <div class="icon-wrap violet">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="4" y="1" width="10" height="16" rx="2" stroke="#8b5cf6" stroke-width="1.5"/>
          <line x1="7" y1="5" x2="11" y2="5" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="7" y1="8" x2="11" y2="8" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
          <line x1="7" y1="11" x2="11" y2="11" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">
        <span class="title">Full Page</span>
        <span class="desc">Scroll-capture entire page</span>
      </div>
    </button>
  </div>

  <div class="section-label">Recording</div>
  <div class="actions">
    <button class="btn" id="recordTab">
      <div class="icon-wrap rose">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="6" stroke="#f43f5e" stroke-width="1.5"/>
          <circle cx="9" cy="9" r="3" fill="#f43f5e"/>
        </svg>
      </div>
      <div class="label">
        <span class="title" id="recordTabLabel">Record Tab</span>
        <span class="desc" id="recordTabDesc">Capture current tab as video</span>
      </div>
    </button>

    <button class="btn" id="recordScreen">
      <div class="icon-wrap rose">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="3" width="16" height="11" rx="2" stroke="#f43f5e" stroke-width="1.5"/>
          <circle cx="9" cy="8.5" r="2.5" fill="#f43f5e"/>
          <line x1="6" y1="16" x2="12" y2="16" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">
        <span class="title" id="recordScreenLabel">Record Screen</span>
        <span class="desc" id="recordScreenDesc">Pick a window or screen</span>
      </div>
    </button>
  </div>

  <div class="status" id="status">
    <div class="status-dot"></div>
    <span id="statusText">Ready</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
